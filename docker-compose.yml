services:
  db:
    image: postgres:16-alpine
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - odoo-net
      - shared-net

  odoo:
    image: odoo:${ODOO_VERSION}
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    command: ["odoo", "--dev=xml"]
    restart: unless-stopped
    networks:
      - odoo-net

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped
    networks:
      - odoo-net

networks:
  odoo-net:
  shared-net:
    external: true

volumes:
  db-data:
  odoo-data:
